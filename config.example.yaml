# 复制为 config.yaml 后修改。config.yaml 含口令哈希，已被 .gitignore 排除。

listen: 127.0.0.1:8080        # 公网部署时放在 Caddy/Nginx 之后，由反代负责 HTTPS
db_path: data/mt.db
admin_password_hash: ""       # 运行 `mt hashpw` 生成
http_proxy: ""                # 仅用于需要代理的出站请求（如 Telegram），A股数据源直连
backfill_start: 2005-01-01    # 全量回填起点

sources:
  enabled: [eastmoney, csindex]   # 为空则启用全部内置插件
  # 指标 → 数据源优先级；主源失败时依次尝试下一个。只有口径一致的来源才能放在同一指标下。
  # 未列出的指标按"所有提供它的插件"路由。
  routes:
    cn.hs300.close:       [csindex, eastmoney]   # 收盘价各源一致，可回退；东财 K 线易被封 IP，放在后面
    cn.hs300.pe_ttm:      [csindex]
    cn.bond.y10:          [eastmoney]
    cn.csiall.amount:     [csindex]
    cn.margin.buy_amount: [eastmoney]
    cn.market.float_mv:   [eastmoney]
    # 以下两个指标只能从东财 K 线（push2his，会封 IP）获取，择时层已不再使用，默认关闭（空列表 = 不同步）
    cn.csiall.turnover:   []
    cn.market.amount:     []
  options: {}

# 个股 / 场内基金日线数据源：按顺序回退，数据同步进本地库长期保存（市场广度等只从本地数据计算）。
# stockdb：本地 free-stockdb（需先启动 stockdb.exe），提供证券清单与除权乘数；
# tencent：腾讯行情，备用源，不提供清单（沿用本地清单），ETF 分红无法识别。
stocks:
  # tdx：通达信行情协议，免注册、纯 Go，提供清单、日线、开高低与成交、除权除息（含 ETF 分红）；不含已退市股票。
  #   单机与云服务器都能用，首次启动可自行回填。协议为逆向所得、数据无使用授权，服务器地址可能变化。
  # stockdb：本机离线库（需先启动 stockdb.exe），含已退市股票与 PE / PB。没有时会自动跳过。
  # tencent：腾讯行情，备用；大量请求会被 WAF 拦截。
  sources: [tdx, stockdb, tencent]
  # 场内基金（ETF/LOF）：stockdb 的基金历史不完整（如 510300 只有 2024 年起），不要放进来；
  # 通达信从上市日起都有，并带 ETF 分红。
  fund_sources: [tdx, tencent]
  skip_funds: false               # true：不同步场内基金日线（例如改由外部脚本导入）
  concurrency: 4
  options:
    tdx:
      connections: 4                  # 同时打开的连接数
      # hosts: "1.2.3.4:7709,5.6.7.8:7709"   # 空为内置服务器列表
    stockdb:
      url: http://127.0.0.1:7899
    tencent:
      interval_ms: 400                # 请求最小间隔；被腾讯 WAF 拦截（HTTP 501）后自动暂停 30 分钟
      # 实测（2026-11-25）：400ms 约 380 次请求后被拦截；30 分钟后改 1500ms，约 160 次又被拦截。
      # 限制更像按时间段累计次数而非速率，调大间隔作用有限：大批量回填需分批（隔天）进行，日常只做少量增量。

# 场外基金净值：只同步在“基金”页添加的自选基金。
funds:
  sources: [eastmoney]

# 外部进程插件（协议见 docs/plugin-protocol.md）。可执行文件与参数只能在这里配置，Web 不能修改。
# plugins:
#   - dir: examples/plugins/csv_source      # 含 plugin.json 的插件目录，也是进程的工作目录
#     command: [python, -I, main.py]
#     timeout_s: 60
#     config: {path: sample.csv}

# 加密货币行情（7×24）：K 线同步进本地库，供加密页与 Polymarket 短期涨跌盘策略使用。
# 大陆网络连不上币安 / OKX：在海外服务器运行，或设 proxy: true 经 http_proxy 访问。
crypto:
  sources: [binance, okx]          # 按顺序回退
  symbols: [BTCUSDT, ETHUSDT, SOLUSDT, XRPUSDT]
  history: {1d: 3000, 1h: 730, 15m: 180, 5m: 30}   # 周期 → 首次回填天数
  every_min: 15                    # mt serve 内的同步间隔
  proxy: false
