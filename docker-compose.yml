services:
  mt:
    # 将 <OWNER> 替换为你的 GitHub 用户名（全部小写）；测试最新开发版可改为 :nightly
    image: ghcr.io/<owner>/market-thermometer:latest
    container_name: market-thermometer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      MT_DB: /app/data/mt.db
      MT_LISTEN: 0.0.0.0:8080
    volumes:
      # 持久化 SQLite 主库（mt.db）、高频盘口库（mt-tick.db）与日志
      # 镜像以 distroless nonroot (65532:65532) 运行；若宿主机挂载目录无写权限可执行: chown -R 65532:65532 ./data
      - ./data:/app/data
    # 若部署在 Caddy / Nginx 反向代理之后，可取消下方注释启用 -trust-proxy
    # command: ["serve", "-trust-proxy", "-log", "/app/data/serve.log"]
